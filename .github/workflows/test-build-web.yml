name: Test Flutter Web Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test-build:
    name: Test Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Supabase Environment File From Secrets
        run: |
          mkdir -p config
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}" > config/supabase.env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}" >> config/supabase.envV

      - name: Analyze Code
        run: flutter analyze

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
