<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TouringBuddy — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background-color: #fffbff;
        color: #1c1b1f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .container {
        text-align: center;
        max-width: 360px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 24px;
        display: block;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #1c1b1f;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #49454f;
        margin-bottom: 32px;
      }
      button {
        background-color: #ff9800;
        color: #ffffff;
        border: none;
        border-radius: 100px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.01em;
      }
      button:hover {
        background-color: #e65100;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="icon">🏔️</span>
      <h1>You're offline</h1>
      <p>
        TouringBuddy needs an internet connection to load your tours and maps.
        Check your connection and try again.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
