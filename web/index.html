<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan and coordinate your outdoor adventures. Pin tour objectives on Swiss topographic maps, invite partners, and set dates."
    />
    <meta name="theme-color" content="#FF9800" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TourenBuddy" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TourenBuddy" />
    <meta
      property="og:description"
      content="Plan and coordinate your outdoor adventures. Pin tour objectives on Swiss topographic maps, invite partners, and set dates."
    />
    <meta property="og:image" content="icons/Icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>TourenBuddy</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Capture beforeinstallprompt before Flutter loads -->
    <script>
      window._pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window._pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwaInstallAvailable'));
      });
      window.addEventListener('appinstalled', function () {
        window._pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwaInstalled'));
      });
    </script>

    <script src="https://unpkg.com/maplibre-gl@^4.3/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@^4.3/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      .maplibregl-canvas,
      canvas {
        cursor: default !important;
      }
      .picking-mode canvas.maplibregl-canvas {
        cursor: crosshair !important;
      }
    </style>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
